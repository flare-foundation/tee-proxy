stages:
  - release-images
  - deploy

.rules:release:
  rules:
    - if: $CI_COMMIT_TAG

#### RELEASE IMAGE #############################################################
release-images:auth:
  stage: release-images
  extends:
    - .rules:release
  image: registry.gitlab.com/flarenetwork/infra-public/pipeliner/pipeliner-stbl:v1.1.0
  id_tokens:
    OIDC_JOB_TOKEN:
      aud: https://gitlab.com
  variables:
    GCP_PROJECT: "flare-network-shared"
    GCP_PROJECT_NUMBER: "940168819002"
  before_script:
    - >-
      WORKLOAD_IDENTITY_POOL=$([ "$CI_COMMIT_REF_PROTECTED" == "true" ] &&
      echo "cr-oidc-gitlab-protected-pool" ||
      echo "cr-oidc-gitlab-pool")
    - >-
      WORKLOAD_IDENTITY_POOL_PROVIDER=$([ "$CI_COMMIT_REF_PROTECTED" == "true" ] &&
      echo "oidc-gitlab-protected" ||
      echo "oidc-gitlab-pool-provider")
    - >-
      SERVICE_ACCOUNT_EMAIL=$([ "$CI_COMMIT_REF_PROTECTED" == "true" ] &&
      echo "cr-prtctd-oidc-cntnr-img-bldr@flare-network-shared.iam.gserviceaccount.com" ||
      echo "cr-oidc-cntnr-img-bldr@flare-network-shared.iam.gserviceaccount.com")
    - . pipeliner gcloud-setup
  script:
    - echo "GOOGLE_OAUTH_ACCESS_TOKEN=$GOOGLE_OAUTH_ACCESS_TOKEN" > auth.env
  artifacts:
    reports:
      dotenv:
        - auth.env

pull-tee-node:
  stage: release-images
  extends:
    - .rules:release
  image:
    name: alpine/git:latest
    entrypoint: [""]
  script:
    - git clone https://${TEE_NODE_DEPLOY_TOKEN}@gitlab.com/flarenetwork/tee/tee-node.git
  artifacts:
    paths:
      - tee-node
    expire_in: 1 hour


release-images:
  stage: release-images
  extends:
    - .rules:release
  needs:
    - job: pull-tee-node
      artifacts: true
    - job: release-images:auth
      artifacts: true
  image:
    name: registry.gitlab.com/flarenetwork/infra-public/pipeliner/kaniko-executor-stbl:v1.23.2-debug
    entrypoint: [""]
  variables:
    DOCKERFILE: "Dockerfile"
    IMAGE: "tee-proxy"
  before_script:
    - mkdir -p /kaniko/.docker
    - auth_encoded=$(echo -n "oauth2accesstoken:$GOOGLE_OAUTH_ACCESS_TOKEN" | base64 | tr -d "\n")
    - echo "{\"auths\":{\"europe-west1-docker.pkg.dev\":{\"auth\":\"$auth_encoded\",\"email\":\"not@val.id\"}}}" > /kaniko/.docker/config.json
  script:
    - cp -r tee-node ..
    - cd ..
    - >-
      image_tag=$CI_COMMIT_TAG
    - echo "Will tag images with \`$image_tag\`."
    - >-
      args="--context ${CI_PROJECT_DIR}/..
        --dockerfile ${CI_PROJECT_DIR}/${DOCKERFILE}
        --cache=true
        --registry-mirror mirror.gcr.io
        --destination europe-west1-docker.pkg.dev/flare-network-staging/containers/${IMAGE}:$image_tag"
    - >-
      if [[ $CI_COMMIT_REF_PROTECTED == "true" ]]; then
        args="$args --destination europe-west1-docker.pkg.dev/flare-network-production/containers/${IMAGE}:$image_tag"
      fi
    - /kaniko/executor $args

#### DEPLOY #############################################################
.deploy:
  stage: deploy
  extends:
    - .rules:release
  image: alpine:latest
  when: manual
  script:
    - apk add --no-cache openssh
    # Add private key
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    
    # Pull new versions of images
    - |
      ssh -o StrictHostKeyChecking=no deploy@$TEE_PROXY_EXTERNAL_IP "
        gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://europe-west1-docker.pkg.dev &&
        cd /home/deploy/e2e/docker/gcp-coston/gcp-proxy &&
        cp .env.example .env  &&
        sed -i 's/^TEE_PROXY_TAG=.*/TEE_PROXY_TAG=$CI_COMMIT_TAG/' .env &&
        docker compose up -d
      "

deploy-package-1:
  extends: .deploy
  variables:
    TEE_PROXY_EXTERNAL_IP: 'tee-proxy-test.flare.rocks'

deploy-package-2:
  extends: .deploy
  variables:
    TEE_PROXY_EXTERNAL_IP: 'tee-proxy-test-2.flare.rocks'

deploy-package-extension:
  extends: .deploy
  variables:
    TEE_PROXY_EXTERNAL_IP: 'tee-proxy-test-extension.flare.rocks'

deploy-deploy-test:
  extends: .deploy
  variables:
    TEE_PROXY_EXTERNAL_IP: '34.52.210.197'