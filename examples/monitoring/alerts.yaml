# Example Prometheus alerting rules for the Flare TEE proxy.
#
# These are STARTING POINTS, not a turnkey policy. Thresholds mirror the proxy's in-code
# constants (noted per rule), but the right values depend on your traffic and SLOs.
# Expressions carry no scrape-job/instance selector — add yours (e.g. {job="tee-proxy"})
# to scope them. Each rule's data requires its metric group to be enabled (see the
# [metrics] block in config and the group table in METRICS.md).
#
# Validate locally:  promtool check rules examples/monitoring/alerts.yaml
# Under the Prometheus Operator, copy these groups into a PrometheusRule resource's .spec.

groups:
  # ---- Data integrity: silent, irrecoverable loss after the work was done -----------
  - name: tee-proxy.data-integrity
    rules:
      - alert: TeeProxyResultsLost
        expr: increase(teeproxy_results_lost_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "TEE proxy lost a result (irrecoverable)"
          description: >-
            A result was acknowledged to the TEE node but never persisted — client-invisible,
            irrecoverable loss. Requires the `result` metric group.

      - alert: TeeProxyFinalizedActionEnqueueFailing
        expr: increase(teeproxy_finalized_action_enqueue_failed_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Finalized action failed to enqueue"
          description: >-
            Consensus reached threshold but the finalized action could not be enqueued to the
            main queue (enqueue failures only; build/send losses are counted separately by
            teeproxy_finalized_action_lost_total). Requires the `voting` metric group.

      - alert: TeeProxyFinalizedActionLost
        expr: increase(teeproxy_finalized_action_lost_total{reason="build_error"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Finalized action dropped before enqueue (build error)"
          description: >-
            Consensus reached threshold but a finalized action was dropped before it could be
            enqueued, because building the action failed to serialize — a practically
            unreachable path. Scoped to reason="build_error"; reason="send_cancelled" is an
            expected transient during shutdown and is not alerted, and reason="send_failed"
            has its own critical alert (TeeProxyFinalizedActionSendFailed). The series is
            pre-initialized to 0, so this fires on the first occurrence. Requires the `voting`
            metric group.

      - alert: TeeProxyFinalizedActionSendFailed
        expr: increase(teeproxy_finalized_action_lost_total{reason="send_failed"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Finalized action lost sending to the node"
          description: >-
            A consensus-finalized action was dequeued — its body already deleted from the main
            queue — but the response write to the TEE node failed, so the action is
            irrecoverably lost. The action ID is in the proxy log line "sending action ...
            failed after dequeue". The series is pre-initialized to 0, so this fires on the
            first occurrence. Requires the `voting` metric group.

  # ---- Security: the proxy's trust assumptions about the TEE -------------------------
  - name: tee-proxy.security
    rules:
      - alert: TeeProxyResultWrongTeeID
        expr: increase(teeproxy_results_rejected_total{reason="wrong_tee_id"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Result signed by an unexpected key"
          description: >-
            A result was signed by a key other than the bound TEE identity — a tamper or
            mis-route signal. Requires the `result` metric group.

      - alert: TeeProxyInfoVerifySignatureFailing
        expr: increase(teeproxy_info_refresh_failures_total{stage="verify_signature"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "TEE info response signature verification failing"
          description: >-
            The signed TEE_INFO response failed signature verification — the info-path
            counterpart to TeeProxyResultWrongTeeID. The stage="verify_signature" series is
            pre-initialized to 0 at startup (metrics.go, same treatment as
            teeproxy_results_rejected_total), so this fires on the first occurrence, not only
            once a series already exists. Requires the `info` metric group.

      - alert: TeeProxyAttestationFailing
        expr: increase(teeproxy_attestation_verify_total{result="error"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "TEE attestation verification failing"
          description: >-
            Attestation verification of a TEE_INFO response failed — possible compromise or
            measurement drift. Inspect the `reason` label. Requires the `attestation` group.

      - alert: TeeProxyMagicPassAccepted
        expr: increase(teeproxy_attestation_verify_total{reason="magic_pass"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "TEE attestation bypassed via magic_pass"
          description: >-
            A TEE_INFO response was accepted via the magic_pass sentinel instead of a real JWT
            chain — must never happen in production (requires allow_magic_pass=true). This series
            carries result="ok", so TeeProxyAttestationFailing (result="error") does not cover it.
            Requires the `attestation` metric group.

      - alert: TeeProxyMagicPassAllowed
        expr: teeproxy_attestation_posture{setting="magic_pass_allowed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "attestation allow_magic_pass enabled"
          description: >-
            The proxy is configured with allow_magic_pass=true, permitting the JWT chain to be
            bypassed — do not run this posture in production. Requires the `attestation` metric
            group.

  # ---- Meta: a disabled security metric group silently disables its page-now rule --
  - name: tee-proxy.meta
    rules:
      - alert: TeeProxyAttestationMetricsMissing
        expr: absent(teeproxy_attestation_verify_total)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Attestation metric group disabled — TeeProxyAttestationFailing is inert"
          description: >-
            teeproxy_attestation_verify_total is absent, so the page-now
            TeeProxyAttestationFailing rule cannot fire. The series exists at 0 in a
            healthy proxy (pre-initialized at startup and set on every info refresh);
            absence means the `attestation` metric group is disabled in [metrics] config.

      - alert: TeeProxyResultMetricsMissing
        expr: absent(teeproxy_results_rejected_total)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Result metric group disabled — TeeProxyResultWrongTeeID is inert"
          description: >-
            teeproxy_results_rejected_total is absent, so the page-now
            TeeProxyResultWrongTeeID rule cannot fire. The series exists at 0 in a
            healthy proxy (pre-initialized at startup); absence means the `result`
            metric group is disabled in [metrics] config.

  # ---- Availability: is the proxy healthy and talking to the node? -------------------
  - name: tee-proxy.availability
    rules:
      - alert: TeeProxyNotReady
        expr: teeproxy_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TEE proxy readiness failing"
          description: >-
            The last readiness evaluation failed (Redis, c-chain, info staleness, attestation,
            or result storage). Requires the `liveness` metric group.

      - alert: TeeProxyInfoStaleWarning
        expr: teeproxy_info_service_delay_seconds > 70
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TEE info refresh lagging"
          description: >-
            No recent successful TEE-info refresh. 70s is half the 140s tolerance
            (liveness.go infoDelayTolerance); readiness flips at 140s. Gives lead time.
            Requires the `liveness` metric group.

      - alert: TeeProxyInfoStale
        expr: teeproxy_info_service_delay_seconds > 140
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TEE info stale past readiness tolerance"
          description: >-
            Info staleness exceeded the 140s tolerance (liveness.go infoDelayTolerance);
            readiness is failing. The 2m debounce absorbs the bootstrap window before the
            first successful info refresh completes (info.go NewService sets LastUpdated to
            the process start time, not zero-time, so this only pages on a genuine
            multi-minute stall). Requires the `liveness` metric group.

      - alert: TeeProxyNodeWaitTimeouts
        expr: sum by (path) (rate(teeproxy_node_response_wait_total{result="timeout"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TEE node response-wait timeouts on {{ $labels.path }}"
          description: >-
            The proxy is timing out waiting for TEE-node responses on this path — node slow or
            unreachable. Requires the `node` metric group.

      - alert: TeeProxyMachinepathPollErrors
        expr: increase(teeproxy_machinepath_poll_total{result=~"fetch_error|build_error|enqueue_error"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Machine-path poll cycle failing"
          description: >-
            A machine-path poll cycle failed before the node ever saw the action (fetching the
            signed list, building the action, or enqueueing it) — the node-wait leg is separately
            covered by teeproxy_node_response_wait_total{path="machinepath"}. Requires the `node`
            metric group.

      - alert: TeeProxyMachinepathRejected
        expr: increase(teeproxy_machinepath_poll_total{result="rejected"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "TEE node rejected the machine-path action"
          description: >-
            The node returned a non-success status for a SET_MACHINE_PATH_LIST action — most
            plausibly a governance/threshold mismatch between the node and the chain. The poller
            never advances its nonce, so the same action is rebuilt and re-rejected every poll
            (~10m) until the mismatch is resolved; the node's own reason is in the proxy log line
            "SET_MACHINE_PATH_LIST action for nonce ... failed". Requires the `node` metric group.

      - alert: TeeProxyHigh5xxRate
        expr: |
          sum by (server) (rate(teeproxy_http_requests_total{status_class="5xx"}[5m]))
            / sum by (server) (rate(teeproxy_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx rate on the {{ $labels.server }} server"
          description: "Over 5% of requests are returning 5xx. Requires the `http` metric group."

      - alert: TeeProxyStorageErrors
        expr: sum by (backend) (rate(teeproxy_storage_operations_total{outcome="error"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Storage errors on {{ $labels.backend }}"
          description: "Sustained Redis/Firestore operation errors. Requires the `storage` metric group."

      - alert: TeeProxyDown
        expr: up{job="tee-proxy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TEE proxy target down"
          description: >-
            Prometheus cannot scrape the proxy. EXAMPLE ONLY — the `job` selector is your
            scrape config; adjust it to match your setup.

  # ---- Consensus: are votings actually finalizing? -----------------------------------
  - name: tee-proxy.consensus
    rules:
      - alert: TeeProxyConsensusStall
        expr: |
          increase(teeproxy_votings_started_total[15m]) > 0
            and increase(teeproxy_voting_threshold_duration_seconds_count[15m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Votings opening but none finalizing"
          description: >-
            Proposals are being opened but none have reached threshold in 15m — offline voters,
            a mis-set threshold, or a partition. Requires the `voting` metric group.

  # ---- Signing policy: is the rollover loop alive and applying? ----------------------
  - name: tee-proxy.policy
    rules:
      - alert: TeeProxyPolicyFetchStalled
        expr: time() - teeproxy_policy_last_fetch_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Signing-policy update loop stalled"
          description: >-
            The signing-policy update loop has not completed an error-free iteration in over
            1800s — roughly 3x the default signing_policy_fetch_interval (10m,
            config.go defaultSigningPolicyFetchInterval). The gauge is seeded at startup, so
            this reflects a genuinely wedged loop, not a cold start. Requires the `policy`
            metric group.

      - alert: TeeProxyPolicyUpdateFailing
        expr: increase(teeproxy_policy_update_total{result=~"build_failed|enqueue_failed|await_failed|rejected"}[15m]) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Signing-policy rollover repeatedly failing"
          description: >-
            A signing-policy rollover is repeatedly failing to build, enqueue, confirm, or
            being rejected by the node — the loop is stuck on one epoch and cannot advance.
            The result="rejected" case is invisible to the node-wait metric (a status!=1
            rejection returns no error). Requires the `policy` metric group.

  # ---- Saturation: backpressure -------------------------------------------------------
  - name: tee-proxy.saturation
    rules:
      - alert: TeeProxyQueueBackpressure
        expr: teeproxy_action_queue_depth{queue="main"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Main action queue not draining"
          description: >-
            Main queue depth above 100 (queue.go queueDepthWarnThreshold) for 10m — the TEE node
            is not draining actions. During Redis degradation the LLEN read fails and the depth
            gauge reads 0 (see teeproxy_action_queue_depth_read_failures_total), so this alert is
            masked; TeeProxyStorageErrors is then the authoritative degradation signal. Requires
            the `queue` metric group.

      - alert: TeeProxyQueueBackpressureDirect
        expr: teeproxy_action_queue_depth{queue="direct"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Direct action queue not draining"
          description: >-
            Direct queue depth above 100 (queue.go queueDepthWarnThreshold, checked
            identically for all three queue IDs) for 10m. Requires the `queue` metric group.

      - alert: TeeProxyQueueBackpressureBackup
        expr: teeproxy_action_queue_depth{queue="backup"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backup action queue not draining"
          description: >-
            Backup queue depth above 100 (queue.go queueDepthWarnThreshold, checked
            identically for all three queue IDs) for 10m. Requires the `queue` metric group.

      - alert: TeeProxyActionEnqueueFailing
        expr: sum(rate(teeproxy_action_enqueue_total{result=~"store_error|queue_error"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Action enqueue failures"
          description: >-
            Actions are failing to enqueue on the ingest path — Redis SET (store_error) or LPUSH
            (queue_error) errors while persisting or appending an action. Requires the `queue`
            metric group.

      - alert: TeeProxyQueueDepthReadFailing
        expr: sum(rate(teeproxy_action_queue_depth_read_failures_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue-depth reads failing — backpressure alert blind"
          description: >-
            Scrape-time queue-depth (LLEN) reads are failing, so the depth gauge reports 0 and
            TeeProxyQueueBackpressure cannot fire. Treat TeeProxyStorageErrors as authoritative
            until reads recover. Requires the `queue` metric group.

      - alert: TeeProxyResultChannelDropped
        expr: increase(teeproxy_result_channel_dropped_total{channel=~"key_actions|backups"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Result fan-out channel full — {{ $labels.channel }} dropped"
          description: >-
            A KEY_* or TEE_BACKUP result was dropped because its in-process fan-out channel was
            full, i.e. the wallet event loop is stalled (typically on Redis-backed backup stores
            during a storage outage). The drop is not permanent loss — a missed key update self-heals
            at the next periodic sync and a missed backup at the next backup trigger — but sustained
            drops mean the loop is wedged. The backup_trigger channel is intentionally excluded
            (a full size-1 coalescing channel is benign). Requires the `result` metric group.

  # ---- Wallet: is the periodic key/proof sync loop healthy? -------------------------
  - name: tee-proxy.wallet
    rules:
      - alert: TeeProxyWalletSyncFailing
        expr: increase(teeproxy_wallet_sync_total{result=~"enqueue_error|parse_error"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Wallet key/proof sync cycle failing"
          description: >-
            A wallet key/proof sync cycle failed before enqueueing to the node (enqueue_error) or
            after a node wait that returned OK but did not decode (parse_error). Node-wait failures
            are separately covered by teeproxy_node_response_wait_total{path=~"wallet_key_info|wallet_key_proof"}.
            Requires the `wallet` metric group.

      - alert: TeeProxyWalletSyncWedged
        expr: increase(teeproxy_wallet_sync_total{result="skipped"}[3h]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Wallet sync appears wedged"
          description: >-
            3 consecutive sync triggers were skipped because a previous sync was still in
            progress. At the 1h wallet sync cadence (walletSyncPeriod), this means sync has not
            completed in 3+ hours — the syncing flag is likely wedged on a stuck tee-node wait.
            Requires the `wallet` metric group.

      - alert: TeeProxyWalletKeyUpdateFailed
        expr: increase(teeproxy_wallet_key_update_failed_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Signed KEY_* result failed to apply to the key cache"
          description: >-
            A signature-verified KEY_* result from the trusted TEE node could not be decoded and
            applied to the key cache — a protocol invariant break, most plausibly a tee-node bug or
            proxy/node version skew. The key cache is left stale (a missing new key or a lingering
            deleted key) until the hourly sync reconciles it; the decode error is in the proxy log
            line "wallet key update". Requires the `wallet` metric group.
