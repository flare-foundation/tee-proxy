name: container-images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build-container-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Set build metadata
      env:
        REPOSITORY: '${{ github.repository }}'
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        # tag main if main branch
        if [[ "$REF_NAME" == "main" ]]; then
          image_tags=("main")
        # tag with tag name if tag
        elif [[ "$REF" == refs/tags/v* ]]; then
          image_tags=("$REF_NAME")
          # tag with latest if tag is a new major, minor or patch version
          if [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            image_tags+=("latest")
          fi
        fi

        lc_repo=${REPOSITORY,,}

        image_paths=()
        for tag in "${image_tags[@]}"; do
          image_paths+=("ghcr.io/$lc_repo:$tag")
        done

        # join with ',' and then skip first character
        ALL_TAGS=$(printf ',%s' "${image_paths[@]}")
        echo "ALL_TAGS=${ALL_TAGS:1}" >>"$GITHUB_ENV"

        echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"

    - name: Login to ghcr.io
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push default image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        push: true
        tags: ${{ env.ALL_TAGS }}
        build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
        outputs: type=registry,rewrite-timestamp=true
