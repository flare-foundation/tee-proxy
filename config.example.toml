redis_port = ":6379"

chain_id = 14

private_key_variable = "PRIVATE_KEY"


initial_signing_policy_offset = 3
signing_policy_fetch_interval = "10m"
db_sync_max_sleep_time = "10m"


[db]
host = "localhost"
port = 3306
database = "flare_ftso_indexer"
username = "root"
password = "root"
log_queries = false


[logging]
level = "DEBUG"
file = ""
max_file_size = ""
console = true


[addresses]
flare_systems_manager = "0xa4bcDF64Cdd5451b6ac3743B414124A6299B65FF"
relay = "0x5A0773Ff307Bf7C71a832dBB5312237fD3437f9F"
voter_registry = "0xB00cC45B4a7d3e1FEE684cFc4417998A1c183e6d"


[ports]
internal = "6661"
external = "6662"


[info_timing]
initial_timeout = "5m"           # 0 for no timeout
cycle_internal = "10s"
cycle_queue_response_wait = "30s"


[voting]
proposal_expiration = "120s"
max_pending_request = 100
history_size = 3                 # Number of most recent signing policy rounds kept in memory
finalized_buffer_size = 10       # Buffer size for the finalized instructions channel
max_provider_vote = 0.025        # Max fraction of total weight a single provider can hold. Caps per-vote variable message size for restore ops. 0 = no cap.


[storage]
action_ttl = "336h"          # 14d — action bodies (Action-* keys)
result_ttl = "336h"          # 14d — Threshold/End results
submit_result_ttl = "30m"    # Submit results (short — bootstrap only)
backup_ttl = "192h"          # 8d — backups and backup index



[firestore]
url = ":8086"
project_id = "your-gcp-project-id"
database_id = ""  # Firestore database ID. Empty = default database.
credentials_file = ""  # Path to service account JSON. Empty = Application Default Credentials.

[direct]
# Direct extension enables POST /direct endpoint (requires API key)
enable = false
api_key = ""
api_key_variable = "DIRECT_API_KEY"
# Set to true to disable API key requirement for /direct endpoint
api_key_optional = false
# Max body size on /direct. 0 defaults to 10 MiB.
max_body_size = 0


[attestation]
# When disabled the proxy trusts whichever TEE answers the bootstrap challenge first.
enable = false

# Each allowlist is optional; leave empty to skip that check.
# JWT signature, nonce, challenge round-trip, and pubkey consistency are always enforced when enabled.

# expected_code_hashes = ["sha256:abcdef..."]            # 32-byte hex, optional 0x/sha256: prefix
# expected_platforms = ["AMD_SEV_SNP_VM", "INTEL_TDX_VM"]
# expected_debug_statuses = ["disabled-since-boot"]

max_token_age = "5m"      # 0 skips freshness check
require_sec_boot = false

# Accept tee-node "magic_pass" sentinel; for non-Confidential-Space test runs only.
allow_magic_pass = false
